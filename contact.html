<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaunchPad - Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="nav-brand">LaunchPad</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </div>
  </nav>

  <main>
    <section class="page-header">
      <h1>Contact Us</h1>
      <p>We'd love to hear from you.</p>
    </section>

    <section class="contact-content">
      <form class="contact-form" action="#" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="How can we help?" required></textarea>

        <button type="submit" class="btn">Send Message</button>
      </form>

      <div class="contact-info">
        <h2>Other Ways to Reach Us</h2>
        <p>Email: hello@launchpad.com</p>
        <p>Phone: (555) 123-4567</p>
        <p>Location: San Francisco, CA</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 LaunchPad. All rights reserved.</p>
  </footer>

</body>
</html>
